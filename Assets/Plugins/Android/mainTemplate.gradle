apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'com.adobe.marketing.mobile:assurance:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:18
    implementation 'com.adobe.marketing.mobile:core:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:14
    implementation 'com.adobe.marketing.mobile:edge:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:16
    implementation 'com.adobe.marketing.mobile:edgeidentity:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:17
    implementation 'com.adobe.marketing.mobile:identity:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:15
    implementation 'com.adobe.marketing.mobile:lifecycle:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:20
    implementation 'com.adobe.marketing.mobile:messaging:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:19
    implementation 'com.adobe.marketing.mobile:sdk-bom:3.11.0' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:13
    implementation 'com.adobe.marketing.mobile:signal:3.+' // Assets/AEPSDK/Editor/AEPSDKDependencies.xml:21
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
